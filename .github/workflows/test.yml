name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test tools
        # Install from setup.py so the declared runtime deps (numpy) are
        # actually pulled in and import paths are exercised for real.
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest "ruff>=0.16,<1.0"

      - name: Lint (ruff)
        # ruff.toml pins target-version=py39 (CI matrix floor); the version
        # floor keeps the default rule set stable across ruff releases.
        run: ruff check .

      - name: Run tests
        run: pytest -q
